services:
  - type: web
    name: fixitnow
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: fixitnow-data
      mountPath: /var/data
      sizeGB: 1
